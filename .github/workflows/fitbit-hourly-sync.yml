# Pulls Fitbit through the production sync every hour.
# This job must not send the daily email. The Vercel cron at 08:30 UTC
# (4:30am in Halifax, Atlantic standard time) calls the same URL without ?email=0 and sends the report.
#
# Required repository secret:
#   CRON_SECRET — the same value as the CRON_SECRET environment variable on Vercel.

name: Hourly Fitbit sync

on:
  schedule:
    # Minute 7, not 0. GitHub often delays or drops schedules that run at the top of the hour.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync Fitbit without sending email
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Add a repository secret named CRON_SECRET. It must match CRON_SECRET in Vercel."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://personal-dashboard-brown.vercel.app/api/cron/fitbit-sync?email=0"
          echo
